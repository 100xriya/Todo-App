<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List V2</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-[#121212] font-sans h-[100vh] flex justify-center items-center flex-col">
    <div
        class="container bg-[#33323233] flex flex-col justify-center items-center p-5 w-fit h-fit rounded-md drop-shadow-lg ">

        <h1 class="h-fit mb-6 text-white text-2xl font-bold">To-do List</h1>
        <div
            class="container bg-[#33323233] flex justify-center items-center p-5 w-fit h-fit rounded-md drop-shadow-lg ">

            <input type="text" placeholder="Add a new task..." id="task" class="p-2 rounded-sm bg-[#333333]">
            <button id="addbtn"
                class="text-white bg-[#6200ea] hover:bg-[#3700b3] rounded-md px-2 py-1 h-10 w-35 m-5 ">Add
                Task</button>
        </div>
        <ul id="list" class="text-white text-sm m-5 text-center w-[415px]"></ul>
    </div>


    <script src="script.js"></script>
</body>

</html>
